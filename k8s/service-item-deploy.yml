apiVersion: apps/v1
kind: Deployment
metadata:
  name: service-item
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: service-item
  template:
    metadata:
      labels:
        app: service-item
    spec:
      containers:
        - name: service-item
          image: hyeonsang/msa-service-item:latest
          ports:
            - containerPort: 8082
          envFrom:
            - configMapRef:
                name: service-item-config
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8082
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8082
            initialDelaySeconds: 20
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: service-item
  namespace: default
spec:
  type: NodePort
  selector:
    app: service-item
  ports:
    - port: 8082
      targetPort: 8082
      nodePort: 30082