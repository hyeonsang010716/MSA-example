apiVersion: apps/v1
kind: Deployment
metadata:
  name: service-user
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: service-user
  template:
    metadata:
      labels:
        app: service-user
    spec:
      containers:
        - name: service-user
          image: hyeonsang/msa-service-user:latest
          ports:
            - containerPort: 8081
          envFrom:
            - configMapRef:
                name: service-user-config
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8081
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8081
            initialDelaySeconds: 20
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: service-user
  namespace: default
spec:
  type: NodePort
  selector:
    app: service-user
  ports:
    - port: 8081
      targetPort: 8081
      nodePort: 30081