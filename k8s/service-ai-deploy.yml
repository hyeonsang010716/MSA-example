apiVersion: apps/v1
kind: Deployment
metadata:
  name: service-ai
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: service-ai
  template:
    metadata:
      labels:
        app: service-ai
    spec:
      imagePullSecrets:
        - name: dockerhub-secret
      containers:
        - name: service-ai
          image: hyeonsang/msa-service-ai:latest
          ports:
            - containerPort: 8084
          envFrom:
            - configMapRef:
                name: service-ai-config
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8084
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8084
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: service-ai
  namespace: default
spec:
  type: NodePort
  selector:
    app: service-ai
  ports:
    - port: 8084
      targetPort: 8084
      nodePort: 30084