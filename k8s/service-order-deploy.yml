apiVersion: apps/v1
kind: Deployment
metadata:
  name: service-order
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: service-order
  template:
    metadata:
      labels:
        app: service-order
    spec:
      containers:
        - name: service-order
          image: hyeonsang/msa-service-order:latest
          ports:
            - containerPort: 8083
          envFrom:
            - configMapRef:
                name: service-order-config
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8083
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8083
            initialDelaySeconds: 20
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: service-order
  namespace: default
spec:
  type: NodePort
  selector:
    app: service-order
  ports:
    - port: 8083
      targetPort: 8083
      nodePort: 30083